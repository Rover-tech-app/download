<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get the app</title>
<!--
  Per-shop join page: …/download/join/?shop=YODER&app=customer (or app=technician).
  A shop's admin app copies this link (Settings → Shop Info → Share the apps) and texts/emails it.
  It shows the shop's own logo and name (read live from that shop's backend), how to get the shared
  app, and a button that opens the app already connected to the shop.
-->
<style>
  :root { --blue:#1b5e9e; --dark:#12324f; --ok:#1f8f4e; --bg:#eef2f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:#1c2733; text-align:center; }
  header { background:linear-gradient(135deg,var(--dark),var(--blue)); color:#fff; padding:34px 20px 30px; }
  header img { max-height:84px; max-width:260px; background:#fff; border-radius:12px; padding:8px; margin-bottom:12px; }
  header h1 { margin:0 0 6px; font-size:28px; }
  header p { margin:0; opacity:.92; font-size:16px; }
  main { max-width:620px; margin:0 auto; padding:22px 18px 40px; }
  .btn { display:block; width:100%; max-width:460px; margin:10px auto; color:#fff; text-decoration:none;
         font-size:20px; font-weight:700; padding:18px; border-radius:14px; }
  .btn.open { background:var(--ok); box-shadow:0 4px 14px rgba(31,143,78,.35); }
  .btn.store { background:#1c2733; }
  .step { display:flex; gap:14px; align-items:flex-start; text-align:left; background:#fff; border:1px solid #dbe3ec;
          border-radius:12px; padding:16px 18px; margin:14px auto; max-width:520px; box-shadow:0 1px 3px rgba(20,40,70,.05); }
  .num { flex:0 0 38px; height:38px; width:38px; border-radius:50%; background:var(--blue); color:#fff;
         font-size:19px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .step h3 { margin:2px 0 6px; font-size:17px; color:var(--dark); }
  .step p { margin:0; font-size:15px; line-height:1.5; }
  .body { flex:1; }
  .code { display:inline-block; font-size:26px; font-weight:800; letter-spacing:2px; background:#eef2f7;
          border:2px dashed #b9c7d6; border-radius:10px; padding:6px 16px; margin-top:6px; }
  .soon { color:#5a6b7d; font-size:14px; }
  .error { background:#fff1f0; border:1px solid #ffc9c4; color:#8a1f16; border-radius:12px; padding:18px; max-width:520px; margin:20px auto; }
  footer { color:#8493a5; font-size:13px; padding:24px; }
</style>
</head>
<body>
<header>
  <img id="logo" alt="" hidden>
  <h1 id="shopName">Loading…</h1>
  <p id="appLabel"></p>
</header>
<main id="main"></main>
<footer>Powered by Rover Tech</footer>

<script>
  // Store links for the shared apps. Fill these in once the apps are published; until then the page
  // says "coming soon" and people can still connect with the code if they have a test build.
  var STORE_LINKS = {
    customer:   { ios: "", android: "" },
    technician: { ios: "", android: "" }
  };
  var APP_SCHEMES = { customer: "rovertech", technician: "rovertechtech" };

  var params = new URLSearchParams(location.search);
  var code = (params.get("shop") || "").trim().toUpperCase();
  var app = params.get("app") === "technician" ? "technician" : "customer";
  var main = document.getElementById("main");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;   // textContent, never innerHTML: shop names come from a database
    return e;
  }
  function showError(message) {
    document.getElementById("shopName").textContent = "Rover Tech";
    main.appendChild(el("div", "error", message));
  }
  function step(n, title, children) {
    var s = el("div", "step"), num = el("div", "num", String(n)), body = el("div", "body");
    body.appendChild(el("h3", null, title));
    children.forEach(function (c) { body.appendChild(c); });
    s.appendChild(num); s.appendChild(body);
    return s;
  }

  if (!/^[A-Z0-9-]{2,32}$/.test(code)) {
    showError("This link is missing its shop code. Ask your shop to send the link again.");
  } else {
    fetch("../shops.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error("list"); return r.json(); })
      .then(function (list) {
        var shop = list.shops && list.shops[code];
        if (!shop) throw new Error("notfound");
        return fetch(shop.supabaseUrl.replace(/\/$/, "") + "/rest/v1/rpc/get_public_shop_branding", {
          method: "POST",
          headers: { "apikey": shop.anonKey, "Authorization": "Bearer " + shop.anonKey, "Content-Type": "application/json" },
          body: "{}"
        }).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; });
      })
      .then(function (rows) { render((rows && rows[0]) || {}); })
      .catch(function (e) {
        showError(e.message === "notfound"
          ? "We couldn't find a shop with the code " + code + ". Check the link with your shop."
          : "We couldn't load this page. Check your internet connection and try again.");
      });
  }

  function render(branding) {
    var name = branding.shop_name || "Your shop";
    var appName = app === "technician" ? "technician app" : "customer app";
    document.title = name + " — " + appName;
    document.getElementById("shopName").textContent = name;
    document.getElementById("appLabel").textContent = "Get the " + name + " " + appName;
    var logoUrl = branding.shop_logo_url;
    if (logoUrl && /^https:\/\//.test(logoUrl)) {
      var logo = document.getElementById("logo");
      logo.src = logoUrl; logo.alt = name + " logo"; logo.hidden = false;
    }

    var links = STORE_LINKS[app];
    var isApple = /iPhone|iPad|iPod|Mac/i.test(navigator.userAgent);
    var getApp = [];
    var order = isApple ? ["ios", "android"] : ["android", "ios"];
    order.forEach(function (platform) {
      if (links[platform]) {
        var a = el("a", "btn store", platform === "ios" ? "Download on the App Store" : "Get it on Google Play");
        a.href = links[platform];
        getApp.push(a);
      }
    });
    if (!getApp.length) {
      getApp.push(el("p", "soon", "The app is coming soon to the App Store and Google Play. If your shop already gave you the app, go to step 2."));
    }
    main.appendChild(step(1, "Install the app", getApp));

    var open = el("a", "btn open", "Open the app & connect");
    open.href = APP_SCHEMES[app] + "://join?shop=" + encodeURIComponent(code);
    var or = el("p", null, "Or open the app and type this shop code:");
    or.style.marginTop = "10px";
    main.appendChild(step(2, "Connect to " + name, [open, or, el("div", "code", code)]));
  }
</script>
</body>
</html>
