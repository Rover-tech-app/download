<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect your bank — Rover Tech</title>
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root { --green:#1B4332; --bg:#0f0f10; --card:#17181a; --text:#e9e7e2; --muted:#a7a39a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; line-height:1.6;
    display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { max-width: 460px; margin: 20px; background:var(--card); border-radius:16px; padding:28px 26px; text-align:center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color:var(--muted); margin: 10px 0; }
  button { background:var(--green); color:#fff; border:0; border-radius:10px; padding:12px 22px;
    font-size:15px; font-weight:600; cursor:pointer; margin-top:12px; }
  button:disabled { opacity:.5; cursor:default; }
  .ok { color:#8FD1AC; font-weight:600; }
  .err { color:#ff9b91; }
</style>
</head>
<body>
  <div class="card">
    <h1>Connect your bank</h1>
    <p id="msg">Click below to securely connect your bank through Stripe. Rover Tech never sees your
      bank login.</p>
    <button id="go">Connect bank</button>
  </div>
<script>
  // Params arrive in the URL fragment (never sent to a server): #pk=<publishable key>&cs=<client secret>
  const params = new URLSearchParams(location.hash.slice(1));
  const pk = params.get("pk");
  const clientSecret = params.get("cs");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("go");

  if (!pk || !clientSecret) {
    msg.innerHTML = '<span class="err">This link is missing its connection details. Please start again from Rover Tech.</span>';
    btn.disabled = true;
  }

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    msg.textContent = "Opening your bank…";
    try {
      const stripe = Stripe(pk);
      const result = await stripe.collectFinancialConnectionsAccounts({ clientSecret });
      if (result.error) {
        msg.innerHTML = '<span class="err">' + result.error.message + '</span>';
        btn.disabled = false;
      } else if (result.financialConnectionsSession &&
                 result.financialConnectionsSession.accounts &&
                 result.financialConnectionsSession.accounts.length > 0) {
        msg.innerHTML = '<span class="ok">✓ Bank connected!</span><br>Return to Rover Tech and click ' +
          '“I’ve connected my bank”.';
        btn.style.display = "none";
      } else {
        msg.textContent = "No account was connected. You can close this window and try again.";
        btn.disabled = false;
      }
    } catch (e) {
      msg.innerHTML = '<span class="err">' + (e && e.message ? e.message : e) + '</span>';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
